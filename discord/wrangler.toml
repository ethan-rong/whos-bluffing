name = "whosbluffing-discord"
main = "src/index.js"
compatibility_date = "2026-09-01"
preview_urls = false

[limits]
cpu_ms = 1000

[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "3001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "PRESENCE_LIMITER"
namespace_id = "3003"
simple = { limit = 10, period = 60 }

# Hourly: each run reveals what is due, posts Monday recaps, and posts the daily question to every server whose
# UTC hour has come (once per server per day).
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "whosbluffing-discord"
# Placeholder. Replace it with the id printed by `npx wrangler d1 create whosbluffing-discord`.
database_id = "2fbd2b5d-f54f-4d4c-b569-172a4949a8ef"

[vars]
# Origin of the web deployment that serves /api/round (no trailing slash, no /api).
API_BASE = "https://bots.whosbluffing.com"
# Developer Portal -> your app -> General Information -> Application ID (public, not a secret).
DISCORD_APP_ID = "1556371051439587461"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
# DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN, SALT, BOT_KEY

# One gateway session so the bot shows as online (src/presence.js).
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]
